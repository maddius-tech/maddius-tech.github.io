<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Random Math Generator | Maddius Tech</title>

    <!-- CSS files -->
    <link rel="stylesheet" href="/base.css">
    <link rel="stylesheet" href="/random-math-generator/random-math.css">
</head>

<body>
    <div class="page">
        <header>
          <h1>Welcome</h1>
        </header>
      
        <main>
          <h1>Random Math Generator</h1>
          <p>Generate random math questions.</p>
          
          <label for="numQs">Number of questions:</label>
          <input type="number" id="numQs" name="numQs" max="10" min="1">
          
          <label for="numDigits">Number of digits:</label>
          <input type="number" id="numDigits" name="numDigits" max="3" min="1">
          
          <button id="goButton">Go!</button>

          <table>
            <thead>
                <tr>
                    <th>Q#</th>
                    <th>Question</th>
                    <th>Answer</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>

          <button id="answersButton">Reveal Answers</button>
      
        </main>
      
        <footer>
          <p>&copy; 2026 Maddius Tech</p>
        </footer>
    </div>

  <script src="/random-math-generator/random-math.js"></script>
</body>
</html>
